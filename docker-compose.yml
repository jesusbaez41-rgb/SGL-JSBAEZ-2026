name: sgl-web

services:
  db:
    image: postgres:16-alpine
    container_name: sgl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sgl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: sgl-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB}
      # HU-COM-07: directorio base de los instaladores (rutas relativas).
      APPS_INSTALLERS_DIR: ${APPS_INSTALLERS_DIR:-/opt/sgl-instaladores}
      # HU-COM-07: tamano maximo por instalador subido (MB).
      APPS_MAX_UPLOAD_MB: ${APPS_MAX_UPLOAD_MB:-1024}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      # HU-COM-07: los instaladores se verifican por SHA-256 dentro del contenedor.
      - ${APPS_INSTALLERS_DIR:-/opt/sgl-instaladores}:/opt/sgl-instaladores
      # HU-COM-12: migraciones disponibles para las pruebas.
      - ./db:/app/db:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sgl-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_FORCE_HTTPS: ${VITE_FORCE_HTTPS:-false}
    container_name: sgl-frontend
    restart: unless-stopped
    environment:
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
    volumes:
      # HU-COM-08: los equipos descargan los instaladores por HTTP.
      - ${APPS_INSTALLERS_DIR:-/opt/sgl-instaladores}:/usr/share/nginx/instaladores:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sgl-net

  squid:
    # HU-COM-09 / RN-016: proxy de filtrado en contenedor.
    # Usa la red del host para ver la IP real de cada PC; las ACL del
    # squid.conf son por IP de origen y detrás del NAT de Docker no servirían.
    image: ubuntu/squid:latest
    container_name: sgl-squid
    restart: unless-stopped
    network_mode: host
    volumes:
      # El backend publica el squid.conf generado en este directorio.
      - ${APPS_INSTALLERS_DIR:-/opt/sgl-instaladores}:/sgl:ro
      # Configuración viva: solo se reemplaza después de validarla.
      - ./squid/squid.conf:/etc/squid/squid.conf:ro

volumes:
  pgdata:
  uploads:

networks:
  sgl-net:
    driver: bridge
